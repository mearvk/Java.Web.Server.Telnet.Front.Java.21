name: Secret guard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  tracked-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if wallets or live credentials are tracked
        run: |
          bad="$(git ls-files | grep -E '(^|/)wallet[^/]*\.dat([.][^/]*)?$|^bitcoin/[0-9]+/wallets/|^authentication/mysql\.auth\.xml$|^\.nwe-credentials$|\.p12$|\.pfx$' || true)"
          if [ -n "$bad" ]; then
            echo "These files must not be committed (see bitcoin/SECURITY.md):"; echo "$bad" | head -50; exit 1
          fi
