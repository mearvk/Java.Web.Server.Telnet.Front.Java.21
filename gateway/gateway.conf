# /etc/nwe/gateway.conf — NWE Gateway Configuration
#
# This file controls how the home JWSTF instance connects to the
# public internet for accepting inbound traffic.
#
# Last updated: 2026-08-02
# Copyright (C) 2026 MEARVK LLC

# ============================================================
# Relay Server (the public-facing central console)
# ============================================================

# Public relay hostname (where home instances register)
RELAY_HOST="relay.mearvk.us"

# Relay API port (HTTPS registration endpoint)
RELAY_PORT=7443

# Relay tunnel port (SSH reverse tunnels)
RELAY_TUNNEL_PORT=7444

# ============================================================
# Ports to Expose
# ============================================================

# Which local ports should be reachable from the internet
# These are the ports that NWE listens on locally
EXPOSE_PORTS=(80 443 8080 23)

# ============================================================
# UPnP / NAT-PMP Settings (Direct Mode)
# ============================================================

# UPnP lease duration in seconds (router mapping lifetime)
# The gateway renews before expiry
UPNP_LEASE=3600

# ============================================================
# Health & Monitoring
# ============================================================

# How often to verify connectivity (seconds)
HEALTH_INTERVAL=120

# ============================================================
# Instance Identity
# ============================================================

# Human-friendly name for this instance (shown in relay directory)
# Leave empty to use hostname
INSTANCE_NAME=""

# Override instance ID (leave empty to use machine-id)
INSTANCE_ID=""

# ============================================================
# Tunnel Settings (Relay Mode)
# ============================================================

# SSH connection timeout
TUNNEL_CONNECT_TIMEOUT=30

# Keepalive interval for tunnel (seconds)
TUNNEL_KEEPALIVE=30

# Max keepalive failures before reconnect
TUNNEL_KEEPALIVE_MAX=3

# ============================================================
# Logging
# ============================================================

# Verbose output (1=yes, 0=no) — useful for debugging
VERBOSE=0
