<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login — Brarner.M.Alete™</title>
    <link rel="stylesheet" href="../css/style.css"/>
    <style>
        .login-box {
            max-width: 380px; margin: 0 auto; padding: 2.5rem;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }
        .login-box h2 { text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem; }
        .form-group input {
            width: 100%; padding: 0.65rem 0.75rem; font-size: 0.9rem;
            background: var(--bg-dark); border: 1px solid var(--border);
            border-radius: var(--radius); color: var(--text-primary); outline: none;
        }
        .form-group input:focus { border-color: var(--accent); }
        .login-btn { width: 100%; }
    </style>
</head>
<body>
<nav class="nav"><div class="nav-inner">
    <a href="../index.xhtml" class="nav-brand">Brarner.M.Alete™</a>
    <ul class="nav-links">
        <li><a href="../index.xhtml">Overview</a></li>
        <li><a href="../species.xhtml">Species</a></li>
        <li><a href="../status.xhtml">Status</a></li>
    </ul>
    <a href="login.xhtml" class="nav-cta active">Admin →</a>
</div></nav>

<section class="hero" style="padding:5rem 2rem;">
    <div class="login-box">
        <h2>Admin Login</h2>
        <form method="POST" action="/bma/admin/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="admin" required="required"/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required="required"/>
            </div>
            <button type="submit" class="btn btn-primary login-btn">Sign In</button>
        </form>
    </div>
</section>

<footer class="footer"><div class="footer-bottom" style="border:none;padding:0;">
    <span>&copy; 2026 MEARVK LLC. All rights reserved.</span>
</div></footer>
</body>
</html>
