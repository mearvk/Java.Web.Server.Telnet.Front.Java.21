# BMA Database Configuration — written by install/deploy scripts
# Read by JSP pages at runtime for server-side JDBC connections
#
# NOTE: If root@localhost fails with "Access denied", run:
#   sudo bash install/create-db-user.sh
# This creates a dedicated 'bma' user that works over TCP/JDBC.
#
# Common issue: MySQL root uses auth_socket on Ubuntu/Debian,
# which only works via 'sudo mysql' (unix socket), not JDBC (TCP).
# Fix: use 127.0.0.1 (forces TCP) and a password-auth user.

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://127.0.0.1:3306/BrarnerScience
db.user=root
db.password=$$Ironman1

# Fallback user (created by install/create-db-user.sh)
# Uncomment these and comment out the above if root doesn't work:
#db.user=bma
#db.password=bma123
