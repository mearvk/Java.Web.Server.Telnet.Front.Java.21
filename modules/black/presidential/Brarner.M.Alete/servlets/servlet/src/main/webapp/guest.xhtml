<script>
var BMA_SESSION_COOKIE = 'bma_session';
var BMA_SESSION_HOURS = 24;
function setCookie(name, value, hours) { var d = new Date(); d.setTime(d.getTime() + (hours * 60 * 60 * 1000)); document.cookie = name + '=' + encodeURIComponent(value) + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax'; }
function setSession(type, ip, settings) { var session = { type: type, ip: ip, settings: settings || {}, created: Date.now() }; setCookie(BMA_SESSION_COOKIE, JSON.stringify(session), BMA_SESSION_HOURS); return session; }

fetch('https://api.ipify.org?format=json')
    .then(function(r){return r.json();})
    .then(function(data){
        document.getElementById('guest-ip').textContent = data.ip;
        setSession('guest', data.ip, {});
    })
    .catch(function(){
        document.getElementById('guest-ip').textContent = '127.0.0.1';
        setSession('guest', '127.0.0.1', {});
    });
</script>
